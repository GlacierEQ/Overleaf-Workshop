name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          cd views/chat-view
          npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Compile extension and webview
        run: npm run compile

      - name: Verify VSCE Package
        run: |
          npx --yes @vscode/vsce package --no-git-tag-version
